[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Keep the main/network loop on core 0; the uninterrupted RF worker runs on core 1.
build_unflags =
    -DARDUINO_RUNNING_CORE=1
build_flags =
    -DARDUINO_RUNNING_CORE=0

monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter

lib_deps =
    ; RF24 v1.6.2, pinned to its commit rather than the mutable release tag.
    https://github.com/nRF24/RF24.git#b11ffc3226ba886f86ac1ca0cd9dc25bb94fd496
    ; Includes upstream's multi-device discovery fix, not in the published 2.7.0 release.
    https://github.com/Aircoookie/Espalexa.git#d5f3ac185fae8a37297ab41ad1dd5f7e15cd7ce9
